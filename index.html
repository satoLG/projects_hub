<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Sato's Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./css/main.css" />
    <script src="./js/main.js"></script>
</head>
<body class="dark">
    <div class="container">
        <div class="header">
            <div class="header-title">
                <img id="homeIcon" onclick="closeIframe()" src="./img/home.png" alt="Home" style="width:2em; height:2em; margin-right:0.6em; vertical-align:middle;" />
                <span id="pageTitle">Sato's Hub</span>
            </div>

            <div class="mode-switch">
                <button id="viewToggle" onclick="toggleView()" title="Switch view">⊞</button>
                <button id="modeToggle" onclick="toggleMode()" title="Switch mode" style="margin-left:10px;">☀️</button>
            </div>             
        </div>
        <div class="search-bar">
            <input type="text" id="inputField" placeholder="Search projects..." onkeyup="filterList()" autocomplete="off" />
        </div>
        <ul id="suggestionsList" class="list-view">
            <li>
                <a href="https://satolg.github.io/walking_pkmn_trainer/" class="item-link" onclick="openInIframe(event, this.href, './img/trainer_sprite.png', 'Walking Pkmn Trainer')">
                    <img src="./img/trainer_sprite.png" alt="walking_pkmn_trainer" class="item-icon-img" />
                    <span class="item-label">Walking Pkmn Trainer</span>
                </a>
            </li>
            <li>
                <a href="https://satolg.github.io/city_of_god_flight/" class="item-link" onclick="openInIframe(event, this.href, './img/gdad_bird_sprite.png', 'City of God Flight')">
                    <img src="./img/gdad_bird_sprite.png" alt="city_of_god_flight" class="item-icon-img" />
                    <span class="item-label">City of God Flight</span>
                </a>
            </li>
        </ul>
        <div id="iframeContainer" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:var(--bg, #181a1b); z-index:1000; flex-direction:column; align-items:center; justify-content:flex-start;">
            <iframe id="projectIframe" src="" style="width:96vw; height:85vh; border:none; border-radius:14px; background:#fff; box-shadow:0 2px 16px #0004; display:block; margin:0 auto;"></iframe>
        </div>
    </div>
</body>
</html>
